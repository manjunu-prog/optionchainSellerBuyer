name: Crude Oil Strike Scanner

on:
  schedule:
    # MCX Market Hours: 09:00 to 23:30/23:50 IST
    # Covers UTC 03:30 to UTC 18:30 (approx 11:50 PM IST)
    - cron: "0,3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57 3-18 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    name: Crude Oil ATM ±5 Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: crude_state.json
          key: crude-state-${{ github.run_id }}
          restore-keys: |
            crude-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas pandas_ta requests dhanhq pytz

      - name: Run Crude Oil scanner
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID:    ${{ secrets.DHAN_CLIENT_ID }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crude_strike_scanner.py

      - name: Commit state file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crude_state.json || true
          git diff --cached --quiet || git commit -m "update crude_state"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}