name: Crude Oil Strike Scanner

on:
  schedule:
    # MCX Market Hours: 09:00 to 23:50 IST (UTC 03:30 to 18:20)
    - cron: "0,3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57 3-18 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    name: Crude Oil ATM ±5 Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # CRITICAL: Changed from 3.11 to 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pandas pandas_ta requests dhanhq pytz

      - name: Run Crude Oil scanner
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID:    ${{ secrets.DHAN_CLIENT_ID }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crude_strike_scanner.py
