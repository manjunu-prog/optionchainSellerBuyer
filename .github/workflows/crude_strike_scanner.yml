name: Crude Oil ATM ±5 Scan

on:
  schedule:
    - cron: "*/3 * * * 1-5"   # Runs every 3 minutes (Mon–Fri)
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"   # Stable version (no pandas_ta needed now)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests dhanhq pytz

      - name: Run Crude Scanner
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python crude_strike_scanner.py
