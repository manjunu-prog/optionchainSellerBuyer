name: ATM Strike Scanner

on:
  schedule:
    # Every 3 minutes during BSE market hours (IST = UTC+5:30)
    # IST 09:15 = UTC 03:45  |  IST 15:30 = UTC 10:00
    - cron: "45,48,51,54,57 3 * * 1-5"
    - cron: "0,3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57 4 * * 1-5"
    - cron: "0,3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57 5 * * 1-5"
    - cron: "0,3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57 6 * * 1-5"
    - cron: "0,3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57 7 * * 1-5"
    - cron: "0,3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57 8 * * 1-5"
    - cron: "0,3,6,9,12,15,18,21,24,27,30 9 * * 1-5"
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  scan:
    name: ATM ±5 Strike Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Restore persisted state file from previous run ──
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: atm_state.json
          key: atm-state-${{ github.run_id }}
          restore-keys: |
            atm-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ATM strike scanner
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID:    ${{ secrets.DHAN_CLIENT_ID }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python atm_strike_scanner.py

      # ── Commit updated state file back to repo ──
      - name: Commit state file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add atm_state.json || true
          git diff --cached --quiet || git commit -m "chore: update atm_state [skip ci]"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
